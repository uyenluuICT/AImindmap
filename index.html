<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thử Thách KTS AI - Fix Layout</title>
    <style>
        :root {
            --primary: #ff6f00;
            --bg: #e3f2fd;
            --card-w: 145px;
            --card-h: 45px;
        }

        * { box-sizing: border-box; touch-action: none; }

        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg);
            height: 100vh; width: 100vw;
            overflow: hidden;
            display: flex; flex-direction: column;
        }

        header {
            height: 7vh; background: white;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .title { color: var(--primary); font-weight: bold; font-size: 1.1rem; }
        .score-board { background: #ffecb3; padding: 5px 15px; border-radius: 20px; font-weight: bold; }

        /* VÙNG CHƠI CHÍNH - DÙNG GRID 3x3 */
        #main-game {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 10px;
            padding: 15px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        /* CHỦ ĐỀ CHÍNH Ở GIỮA */
        .center-node {
            grid-column: 2;
            grid-row: 2;
            background: radial-gradient(circle, #ff9800, #e65100);
            color: white;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            text-align: center; font-weight: bold; font-size: 0.85rem;
            border: 4px solid white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            width: 140px; height: 140px;
            justify-self: center; align-self: center;
            z-index: 5;
        }

        /* CÁC NHÁNH CHÍNH */
        .branch {
            background: rgba(255, 255, 255, 0.85);
            border: 2px dashed #90caf9;
            border-radius: 15px;
            display: flex; flex-direction: column;
            padding: 8px;
            transition: 0.3s;
            min-height: 120px;
        }

        .branch.drag-over { background: #fff9c4; border-style: solid; transform: scale(1.02); }

        .branch-title {
            font-size: 0.9rem; font-weight: bold;
            text-align: center; margin-bottom: 5px;
            padding: 2px; border-bottom: 1px solid #eee;
        }

        .drop-zone {
            flex: 1; display: flex; flex-wrap: wrap;
            gap: 4px; justify-content: center; align-content: flex-start;
        }

        /* ĐỊNH VỊ CỤ THỂ TỪNG NHÁNH */
        .b1 { grid-column: 1; grid-row: 1; border-color: #2196f3; }
        .b2 { grid-column: 2; grid-row: 1; border-color: #ff9800; }
        .b3 { grid-column: 3; grid-row: 1; border-color: #e91e63; }
        .b5 { grid-column: 1; grid-row: 2; border-color: #4caf50; }
        .b4 { grid-column: 3; grid-row: 2; border-color: #9c27b0; }
        .b6 { grid-column: 2; grid-row: 3; border-color: #f44336; }

        /* KHO TỪ KHÓA */
        #keyword-dock {
            height: 25vh;
            background: #bbdefb;
            border-top: 4px solid #64b5f6;
            padding: 10px;
            display: flex; flex-wrap: wrap;
            justify-content: center; gap: 8px;
            overflow-y: auto;
        }

        .card {
            width: var(--card-w); height: var(--card-h);
            background: white; border: 2px solid #1565c0;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            text-align: center; font-size: 0.85rem; font-weight: 600;
            cursor: grab; box-shadow: 0 3px 0 #1565c0;
            padding: 4px;
        }

        .card.selected { background: #fff59d; border-color: #fbc02d; }
        
        .card.placed {
            width: auto; height: auto;
            padding: 3px 8px; font-size: 0.75rem;
            background: #e8f5e9; border-color: #4caf50;
            box-shadow: none; cursor: default;
        }

        #toast {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85); color: white;
            padding: 15px 30px; border-radius: 30px; display: none; z-index: 100;
        }

        #win-screen {
            position: fixed; inset: 0; background: rgba(255,255,255,0.95);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 200;
        }

        button { padding: 10px 25px; border-radius: 20px; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <div class="title">🤖 KTS SƠ ĐỒ TƯ DUY AI</div>
    <div class="score-board">Đã xếp: <span id="count">0</span>/18</div>
    <button onclick="location.reload()" style="background: #eee;">Làm lại</button>
</header>

<div id="main-game">
    <!-- Hàng 1 -->
    <div class="branch b1" data-cat="hoc-tap">
        <div class="branch-title" style="color:#1976d2">1. Học tập</div>
        <div class="drop-zone"></div>
    </div>
    <div class="branch b2" data-cat="giao-thong">
        <div class="branch-title" style="color:#ef6c00">2. Giao thông</div>
        <div class="drop-zone"></div>
    </div>
    <div class="branch b3" data-cat="y-te">
        <div class="branch-title" style="color:#c2185b">3. Y tế</div>
        <div class="drop-zone"></div>
    </div>

    <!-- Hàng 2 -->
    <div class="branch b5" data-cat="loi-ich">
        <div class="branch-title" style="color:#388e3c">5. Lợi ích</div>
        <div class="drop-zone"></div>
    </div>
    
    <div class="center-node">
        CHỦ ĐỀ CHÍNH:<br>TRÍ TUỆ NHÂN TẠO (AI)
    </div>

    <div class="branch b4" data-cat="giai-tri">
        <div class="branch-title" style="color:#7b1fa2">4. Giải trí</div>
        <div class="drop-zone"></div>
    </div>

    <!-- Hàng 3 (Nhánh 6 nằm ở giữa hàng 3) -->
    <div class="branch b6" data-cat="han-che">
        <div class="branch-title" style="color:#d32f2f">6. Hạn chế</div>
        <div class="drop-zone"></div>
    </div>
</div>

<div id="keyword-dock"></div>

<div id="toast"></div>

<div id="win-screen">
    <h1 style="color: #4caf50;">XUẤT SẮC! 🎉</h1>
    <p>Em đã hoàn thành Sơ đồ tư duy AI rất gọn gàng!</p>
    <button onclick="location.reload()" style="background: #ff9800; color: white;">CHƠI LẠI</button>
</div>

<script>
    const data = [
        { id: 1, text: "Giải bài tập", cat: "hoc-tap" },
        { id: 2, text: "Dịch ngôn ngữ", cat: "hoc-tap" },
        { id: 3, text: "Gợi ý tài liệu", cat: "hoc-tap" },
        { id: 4, text: "Xe tự lái", cat: "giao-thong" },
        { id: 5, text: "Bản đồ chỉ đường", cat: "giao-thong" },
        { id: 6, text: "Phân luồng giao thông", cat: "giao-thong" },
        { id: 7, text: "Chẩn đoán bệnh", cat: "y-te" },
        { id: 8, text: "Rô-bốt phẫu thuật", cat: "y-te" },
        { id: 9, text: "Nhắc lịch uống thuốc", cat: "y-te" },
        { id: 10, text: "Gợi ý bài hát", cat: "giai-tri" },
        { id: 11, text: "Trò chơi thông minh", cat: "giai-tri" },
        { id: 12, text: "Tạo ảnh hoạt hình", cat: "giai-tri" },
        { id: 13, text: "Xử lý nhanh", cat: "loi-ich" },
        { id: 14, text: "Tiết kiệm thời gian", cat: "loi-ich" },
        { id: 15, text: "Làm việc 24/7", cat: "loi-ich" },
        { id: 16, text: "Phụ thuộc vào máy", cat: "han-che" },
        { id: 17, text: "Có thể đưa tin sai", cat: "han-che" },
        { id: 18, text: "Thiếu cảm xúc", cat: "han-che" }
    ];

    let score = 0;
    let selectedEffort = null;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playNote(freq, type, duration) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    }

    function init() {
        const dock = document.getElementById('keyword-dock');
        [...data].sort(() => Math.random() - 0.5).forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.textContent = item.text;
            card.id = 'c' + item.id;
            card.draggable = true;
            card.dataset.cat = item.cat;

            card.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text', card.id);
                card.classList.add('selected');
            });
            card.addEventListener('dragend', () => card.classList.remove('selected'));
            card.addEventListener('click', () => {
                if (selectedEffort) selectedEffort.classList.remove('selected');
                selectedEffort = card;
                card.classList.add('selected');
            });
            dock.appendChild(card);
        });

        document.querySelectorAll('.branch').forEach(branch => {
            branch.addEventListener('dragover', (e) => {
                e.preventDefault();
                branch.classList.add('drag-over');
            });
            branch.addEventListener('dragleave', () => branch.classList.remove('drag-over'));
            branch.addEventListener('drop', (e) => {
                e.preventDefault();
                branch.classList.remove('drag-over');
                validate(document.getElementById(e.dataTransfer.getData('text')), branch);
            });
            branch.addEventListener('click', () => {
                if (selectedEffort) {
                    validate(selectedEffort, branch);
                    selectedEffort.classList.remove('selected');
                    selectedEffort = null;
                }
            });
        });
    }

    function validate(card, branch) {
        if (!card || card.classList.contains('placed')) return;
        if (card.dataset.cat === branch.dataset.cat) {
            branch.querySelector('.drop-zone').appendChild(card);
            card.classList.add('placed');
            card.draggable = false;
            score++;
            document.getElementById('count').textContent = score;
            playNote(800, 'sine', 0.1);
            if (score === 18) document.getElementById('win-screen').style.display = 'flex';
        } else {
            playNote(150, 'square', 0.2);
            const t = document.getElementById('toast');
            t.textContent = "Chưa đúng rồi, hãy thử lại!";
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 1200);
        }
    }

    init();
</script>
</body>
</html>
